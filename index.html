<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#080d20"><meta name="description" content="조이스틱 하나로 즐기는 네온 미로 아케이드"><title>PAC-MAN · Neon Run</title><link rel="stylesheet" href="style.css?v=elastic-stick-3x"></head>
<body><main class="arcade"><header><a class="brand" href="./" aria-label="PAC-MAN 홈"><i></i>PAC-MAN<span>NEON RUN</span></a><div class="tools"><button id="sound" aria-label="음악과 효과음 끄기" aria-pressed="true">♫</button><button id="pause" aria-label="일시정지">Ⅱ</button></div></header>
<section class="dashboard" aria-label="게임 정보"><div><small>SCORE</small><strong id="score">00000</strong></div><div><small>BEST</small><strong id="best">00000</strong></div><div><small>STAGE</small><strong id="stage">01</strong></div><div><small>LIVES</small><strong id="lives">● ● ●</strong></div></section>
<div class="board-wrap"><canvas id="game" width="600" height="600" aria-label="팩맨 미로 게임"></canvas><div id="overlay" class="overlay"><div class="modal"><div class="eyebrow" id="eyebrow">THE MAZE IS CALLING</div><div class="mascot">ᗧ<span>· · ·</span></div><h1 id="title">한 입 더, 한 칸 더.</h1><p id="message">빛나는 미로를 달리고 유령을 따돌리세요.<br>조이스틱 하나면 충분합니다.</p><div id="difficulty" class="difficulty" aria-label="난이도"><button data-level="easy">쉬움</button><button data-level="normal" class="selected">보통</button><button data-level="hard">어려움</button></div><button id="primary" class="primary">게임 시작 <span>→</span></button><button id="secondary" class="secondary" hidden>처음으로</button></div></div><div id="toast" role="status"></div></div>
<div class="progress"><div id="progress"></div></div><div class="status-line"><span id="hint">작은 도트 10 · 파워 펠렛 50</span><span id="remaining"></span></div>
<section class="controls"><div class="control-copy"><span class="tag">ONE STICK. ALL PLAY.</span><h2>원하는 방향으로<br>가볍게 밀어주세요.</h2><p>원 밖에서도 조작 · 손을 떼면 제자리로.</p><span class="power-key"><i></i> 파워 펠렛을 먹으면 추격 시작!</span></div><div id="joystick" role="group" aria-label="이동 조이스틱. 아래 조작 영역 어디서나 터치하고 드래그하세요. 원 밖에서도 방향 입력이 유지됩니다. PC에서는 방향키 또는 WASD도 사용할 수 있습니다."><div class="joy-ring"><span class="up">⌃</span><span class="down">⌄</span><span class="left">‹</span><span class="right">›</span><div id="knob"></div></div><span class="joy-label">MOVE</span></div></section><footer>NEON ARCADE <span>조이스틱 · 마우스 드래그 · 방향키 / WASD</span></footer></main><script src="game.js?v=elastic-stick-3x"></script></body></html>
